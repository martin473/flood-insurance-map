name: data

# Rebuilds map/data/ri-costs.json ("what neighbors paid") from two published datasets:
# FEMA's NFIP policy records (OpenFEMA, refreshed about monthly) and the Treasury's ZIP-level
# homeowners premiums. No model involved; `floodrules costs` refuses to write if the download
# looks truncated or a field was renamed, so a bad pull fails here instead of reaching the map.

on:
  schedule:
    - cron: "17 7 12 * *"   # the 12th of each month, after FEMA's monthly refresh
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data
  cancel-in-progress: false

jobs:
  costs:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e ".[data]"
      - name: Download and summarize
        run: |
          set -o pipefail
          floodrules costs | tee summary.txt
          { echo '```'; cat summary.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Commit the refreshed file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add map/data/ri-costs.json
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "Refresh what-neighbors-paid data ($(date -u +%Y-%m-%d))"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
