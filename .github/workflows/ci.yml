name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]" ruff mypy
      - run: ruff check floodrules tests
      - run: mypy --ignore-missing-imports floodrules
      - run: pytest --cov=floodrules --cov-report=term-missing --cov-fail-under=85

  docker:
    # Builds the deploy image and checks it starts and answers /health, so a broken Dockerfile
    # is caught here rather than in a failed DigitalOcean deploy.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t flood-api .
      - name: Start the container and check /health
        run: |
          docker run -d --name api -p 8080:8080 -e FLOODRULES_ADMIN_TOKEN=ci-token flood-api
          for i in $(seq 1 30); do curl -fsS localhost:8080/health && break; sleep 1; done
          echo "check: /health"; curl -fsS localhost:8080/health | grep '"ok":true'
          echo "check: /metrics"; curl -fsS localhost:8080/metrics | grep '"fema_nfhl"'
          # /extract must refuse a real upload without the admin token (a request with no file would
          # fail validation with 422 before auth is checked, which proves nothing)
          echo "check: /extract refuses uploads without the token"
          printf '%%PDF-1.4\n' > probe.pdf
          code=$(curl -s -o /dev/null -w '%{http_code}' -F file=@probe.pdf localhost:8080/extract)
          echo "extract without token -> $code"; test "$code" = "401"
          echo "check: JSON request log"; docker logs api 2>&1 | grep '"event": "request"'
      - if: failure()
        run: docker logs api 2>&1 || true

  droplet:
    # Runs deploy/droplet.sh exactly as on the droplet (as root, systemd service, no Docker),
    # deploying the commit under test, then checks the map and API it serves.
    runs-on: ubuntu-latest
    steps:
      - name: Run the droplet deploy script
        run: |
          curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/deploy/droplet.sh" -o droplet.sh
          sudo -H env REF=${{ github.sha }} bash droplet.sh
      - name: Check the map and API it serves
        run: |
          echo "check: /api/health"; curl -fsS localhost:8080/api/health | grep '"ok":true'
          echo "check: map at /"; curl -fsS localhost:8080/ | grep -q '<title>Rhode Island Flood Outlook</title>'
          echo "check: map points at /api"; curl -fsS localhost:8080/ | grep -q 'name="flood-api" content="/api"'
          echo "check: /api/metrics"; curl -fsS localhost:8080/api/metrics | grep -q '"fema_nfhl"'
          echo "check: service restarts on failure"; sudo systemctl kill flood-insurance-map; sleep 6; curl -fsS localhost:8080/api/health | grep -q '"ok":true'
          echo "check: rerunning updates in place"; sudo -H env REF=${{ github.sha }} bash droplet.sh | tail -3
      - if: failure()
        run: sudo journalctl -u flood-insurance-map -n 100 --no-pager || true
