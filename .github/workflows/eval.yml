name: eval

# Runs the real extraction eval against Ollama Cloud. Manual only: it calls a model and
# downloads the insurer PDFs, so it shouldn't run on every push.
# Setup once: repo Settings > Secrets and variables > Actions > New secret OLLAMA_API_KEY.

on:
  workflow_dispatch:
    inputs:
      models:
        description: "Space-separated models, e.g. ollama:nemotron-3-nano:30b ollama:gemma4:31b"
        required: true
        default: "ollama:gpt-oss:120b ollama:gemma4:31b"
      runs:
        description: "Times to repeat the eval; scores are reported as mean (lowest-highest)"
        required: true
        default: "3"

permissions:
  contents: read

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e .
      - name: Download the eval documents
        run: |
          floodrules fetch | tee fetch.log
          # the fetch result as an annotation, so a document CI couldn't download is visible
          echo "::notice title=Eval documents::$(sed -e 's/%/%25/g' fetch.log | awk 'BEGIN{ORS="%0A"} {print}')"
      - name: Run the eval
        env:
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
          MODELS: ${{ inputs.models }}
          RUNS: ${{ inputs.runs }}
        run: |
          if [ -z "$OLLAMA_API_KEY" ]; then
            echo "::error::Add an OLLAMA_API_KEY secret under Settings > Secrets and variables > Actions."
            exit 1
          fi
          args=""
          for m in $MODELS; do args="$args --model $m"; done
          case "$RUNS" in ''|*[!0-9]*) echo "::error::runs must be a number"; exit 1;; esac
          floodrules eval $args --runs "$RUNS"
      - name: Post the results on the run page
        if: always()
        run: |
          test -f evals/runs/latest.md || exit 0
          cat evals/runs/latest.md >> "$GITHUB_STEP_SUMMARY"
          # also as annotations (GitHub keeps about 4 KB of each), readable through the checks API
          split -b 3800 evals/runs/latest.md part-
          i=1
          for f in part-*; do
            echo "::notice title=Eval summary part $i::$(sed -e 's/%/%25/g' "$f" | awk 'BEGIN{ORS="%0A"} {print}')"
            i=$((i+1))
            if [ "$i" -gt 9 ]; then break; fi
          done
          true
      - name: Save the report and model responses
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-${{ github.run_number }}
          # cache/ holds the raw model answers, so `floodrules eval --replay` can rescore them locally
          path: |
            evals/runs/
            evals/cache/
          retention-days: 30
