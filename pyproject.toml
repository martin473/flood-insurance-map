[project]
name = "flood-rules"
version = "0.1.0"
description = "Extract flood insurers' eligibility rules from PDFs into typed schemas, verify them against the source, and evaluate coverage for a property."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "pydantic>=2.7",
  "pypdf>=4.0",
  "requests>=2.31",
  "python-multipart>=0.0.9",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
data = ["openpyxl>=3.1"]
dev = ["pytest>=8", "pytest-cov>=5", "httpx>=0.27", "reportlab>=4"]

[project.scripts]
floodrules = "floodrules.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["floodrules*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 160

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]
# B008: FastAPI's File()/Form() defaults are the framework's idiom
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# prompts and schema descriptions are prose
"floodrules/extract.py" = ["E501"]
"floodrules/schemas.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["floodrules"]
known-local-folder = ["conftest"]
