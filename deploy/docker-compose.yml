# Runs on a single server (a DigitalOcean droplet): Caddy serves the map at / and proxies /api to the API.
# Started by deploy/droplet.sh; settings come from deploy/.env, which the script creates.
services:
  api:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      # Caddy sets x-forwarded-for to the real client address, so the rate limit can use it
      FLOODRULES_TRUST_PROXY: "1"
    expose:
      - "8080"

  web:
    image: caddy:2.8
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
    env_file: .env
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ../map:/srv/map:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
